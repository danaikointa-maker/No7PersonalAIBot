<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>No7 Companion</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { display: grid; place-items: center; -webkit-app-region: drag; }
      canvas { width: 100%; height: 100%; max-width: 260px; max-height: 260px; }
      #bubble {
        position: fixed; left: 50%; top: 4px; transform: translateX(-50%);
        background: #fff; color: #111; border-radius: 12px; padding: 6px 10px;
        font: 12px/1.4 system-ui, "Noto Sans Thai", sans-serif; max-width: 92%;
        box-shadow: 0 6px 18px rgba(0,0,0,.35); display: none; -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <canvas id="avatar" width="520" height="520"></canvas>
    <div id="bubble"></div>
    <script type="module" src="/src/overlay.js"></script>
  </body>
</html>
