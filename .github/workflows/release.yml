name: Release

# ออกเดสก์ท็อปแอป 3 แพลตฟอร์ม + PWA dist เมื่อ push tag vX.Y.Z
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag ที่จะเติม release assets (เว้นว่างเพื่อใช้ ref ที่เลือก)'
        type: string
        required: false
      draft:
        description: 'สร้างเป็น draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser smoke
        run: npm run test:browser
      - name: Build + performance budget
        run: |
          npm run build
          npm run perf

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: '--linux deb'
          - os: macos-15-intel
            target: '--mac zip'
          - os: windows-latest
            target: '--win nsis portable'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Package desktop app
        shell: bash
        run: |
          set +e
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "### Sanitized packaging log (last 30 lines)" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/electron-builder.log" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          # Keep enough sanitized tail context to show the actual failing command,
          # even when electron-builder's final diagnostic misses known keywords.
          selected = lines[-30:]
          sanitized = []
          for line in selected:
              line = re.sub(r"https?://[^\s\"']+", '[URL redacted]', line)
              line = re.sub(r'(?i)(api[_-]?key|token|secret|password|passphrase|authorization)(\s*[:=]\s*)[^,\s]+', r'\1\2[REDACTED]', line)
              line = re.sub(r'(?i)(--password|--passphrase|-p)(\s+)([^\s]+)', r'\1\2[REDACTED]', line)
              line = re.sub(r'(?i)\bgh[pousr]_[A-Za-z0-9_]{20,}\b', '[TOKEN REDACTED]', line)
              sanitized.append(line[:2000])
          # GitHub limits workflow-command annotations per step; combine the full tail
          # into a single annotation so the final error cannot be dropped.
          message = "\n".join(sanitized)
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Sanitized packaging log::{message}')
          PY
            exit "$build_status"
          fi
        env:
          DEBUG: electron-builder
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: no7-desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: ${{ inputs.draft == true }}
          name: No7 AI ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/latest*.yml
