name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # electron/esbuild binaries ไม่จำเป็นสำหรับ test + build ของเว็บ
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency audit gate
        run: npm audit --audit-level=moderate
      - name: Syntax + structure check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser smoke test (jsdom)
        run: npm run test:browser
      - name: Build PWA
        run: npm run build
      - name: Performance budget
        run: npm run perf
      - name: Upload dist
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: no7-dist
          path: dist/
          retention-days: 7

  desktop-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify Electron runtime
        run: npx electron --version
      - name: Build web bundle
        run: npm run build
      - name: Package Linux desktop installer
        run: npx electron-builder --linux deb --publish never

  mobile-android-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Generate and sync Android project
        run: npm run mobile:add:android && npx cap sync android

  mobile-ios-smoke:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install mobile dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Generate and sync iOS project
        run: npm run mobile:add:ios && npx cap sync ios

  artifact-roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - name: Create two synthetic release artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/no7-artifact-a" "$RUNNER_TEMP/no7-artifact-b"
          printf 'linux-installer\n' > "$RUNNER_TEMP/no7-artifact-a/linux.txt"
          printf 'windows-installer\n' > "$RUNNER_TEMP/no7-artifact-b/windows.txt"
      - name: Upload first artifact
        uses: actions/upload-artifact@v7
        with:
          name: no7-artifact-a
          path: ${{ runner.temp }}/no7-artifact-a/linux.txt
      - name: Upload second artifact
        uses: actions/upload-artifact@v7
        with:
          name: no7-artifact-b
          path: ${{ runner.temp }}/no7-artifact-b/windows.txt
      - name: Download and merge artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/no7-artifact-roundtrip
          merge-multiple: true
      - name: Verify artifact contents
        env:
          ROUNDTRIP_DIR: ${{ runner.temp }}/no7-artifact-roundtrip
        run: |
          test "$(cat "$ROUNDTRIP_DIR/linux.txt")" = 'linux-installer'
          test "$(cat "$ROUNDTRIP_DIR/windows.txt")" = 'windows-installer'

  browser-e2e:
    runs-on: ubuntu-22.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Dependency audit gate
        run: npm audit --audit-level=moderate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Core real-browser E2E (Chromium)
        run: npx playwright test tests/e2e/chat.spec.js

  browser-capability-e2e:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-browser capability E2E
        run: npx playwright test tests/e2e/capabilities.spec.js
