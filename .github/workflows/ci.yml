name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      # electron/esbuild binaries ไม่จำเป็นสำหรับ test + build ของเว็บ
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax + structure check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Browser smoke test (jsdom)
        run: npm run test:browser
      - name: Build PWA
        run: npm run build
      - name: Performance budget
        run: npm run perf
      - name: Upload dist
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: no7-dist
          path: dist/
          retention-days: 7

  desktop-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify Electron runtime
        run: npx electron --version
      - name: Build web bundle
        run: npm run build
      - name: Package Linux desktop installer
        run: npx electron-builder --linux deb --publish never
